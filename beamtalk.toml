[package]
name = "symphony"
version = "0.1.0"

[application]
supervisor = "SymphonySupervisor"

[release]
console = true
include-compiler = true

[dependencies]
http = "0.3.6"

yaml = "0.2.1"
linear = "0.1.3"
agents = "0.1.1"
liquid = { git = "https://github.com/jamesc/beamtalk-liquid", tag = "v0.1.0" }

[diagnostics]
definite-assignment = "error"
unguarded-late-read = "error"
handleinfo-no-catch-all = "error"
cascade-drops-update = "error"
match-arm-block = "error"
