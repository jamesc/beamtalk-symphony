[package]
name = "symphony"
version = "0.1.0"

[application]
supervisor = "SymphonySupervisor"

[release]
console = true
include-compiler = true

[dependencies]
http = "0.3.4"

yaml = "0.2.0"
linear = "0.1.2"
agents = "0.1.1"

[diagnostics]
definite-assignment = "error"
unguarded-late-read = "error"
handleinfo-no-catch-all = "error"
cascade-drops-update = "error"
match-arm-block = "error"
